<div class="language-switcher relative" [attr.data-testid]="'language-switcher'">
  <button
    class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-100 transition-colors"
    (click)="toggleDropdown()"
    [attr.data-testid]="'language-switcher-button'"
    aria-label="Select language"
  >
    <span class="text-lg">{{ currentLang().flag }}</span>
    <span class="text-sm font-medium text-gray-700 hidden sm:inline">{{ currentLang().name }}</span>
    <svg
      class="w-4 h-4 text-gray-500 transition-transform"
      [class.rotate-180]="isOpen()"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  @if (isOpen()) {
    <ul
      class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-1 z-50"
      [attr.data-testid]="'language-dropdown'"
    >
      @for (lang of languages; track lang.code) {
        <li
          class="px-4 py-2 hover:bg-gray-100 cursor-pointer flex items-center gap-3"
          [class.bg-lavender-50]="lang.code === currentLanguage()"
          (click)="selectLanguage(lang.code)"
          [attr.data-testid]="'language-option-' + lang.code"
        >
          <span class="text-lg">{{ lang.flag }}</span>
          <span class="text-sm font-medium text-gray-700">{{ lang.name }}</span>
          @if (lang.code === currentLanguage()) {
            <svg
              class="w-4 h-4 text-lavender-600 ml-auto"
              fill="currentColor"
              viewBox="0 0 20 20"
            >
              <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
            </svg>
          }
        </li>
      }
    </ul>
  }
</div>
