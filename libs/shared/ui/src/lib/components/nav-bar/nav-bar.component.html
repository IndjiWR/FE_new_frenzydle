<nav
  class="nav-bar fixed top-0 left-0 right-0 z-50 bg-white/80 dark:bg-zinc-900/80 backdrop-blur-sm border-b border-gray-200 dark:border-zinc-700 h-16"
  [attr.data-testid]="'nav-bar'"
>
  <div class="max-w-7xl mx-auto px-4 h-full flex items-center justify-between">
    <!-- Logo -->
    <a
      routerLink="/"
      class="flex items-center hover:opacity-80 transition-opacity"
      [attr.data-testid]="'nav-logo'"
    >
      <app-logo size="sm" [animated]="false" />
    </a>

    <!-- Desktop Navigation -->
    <div class="hidden md:flex items-center gap-6" [attr.data-testid]="'desktop-nav'">
      @for (item of navItems(); track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="text-lavender-600 dark:text-lavender-400 font-semibold"
          [routerLinkActiveOptions]="{ exact: true }"
          class="text-gray-600 dark:text-gray-300 hover:text-lavender-600 dark:hover:text-lavender-400 transition-colors font-medium"
          [attr.data-testid]="'nav-link-' + item.label"
        >
          {{ item.label | translate }}
        </a>
      }
    </div>

    <!-- Right Section -->
    <div class="flex items-center gap-4">
      <!-- Language Switcher -->
      <app-language-switcher
        (languageChange)="closeMobileMenu()"
        [attr.data-testid]="'nav-language-switcher'"
      ></app-language-switcher>

      <!-- User Avatar / Login Button -->
      <div class="hidden sm:flex items-center" [attr.data-testid]="'user-section'">
        @if (isLoggedIn()) {
          <!-- User Menu Trigger -->
          <div class="relative">
            <button
              class="flex items-center gap-2 px-2 py-1 rounded-lg hover:bg-gray-100 dark:hover:bg-zinc-700 transition-colors"
              (click)="toggleUserMenu()"
              [attr.data-testid]="'user-menu-trigger'"
            >
              @if (userAvatar()) {
                <img
                  [src]="userAvatar()"
                  [alt]="userName()"
                  class="w-8 h-8 rounded-full object-cover border-2 border-lavender-300"
                  [attr.data-testid]="'user-avatar'"
                />
              } @else {
                <div
                  class="w-8 h-8 rounded-full bg-lavender-100 dark:bg-lavender-900 flex items-center justify-center"
                  [attr.data-testid]="'user-avatar-placeholder'"
                >
                  <span class="text-sm font-medium text-lavender-600 dark:text-lavender-300">{{ userName().charAt(0) }}</span>
                </div>
              }
              <span class="text-sm font-medium text-gray-700 dark:text-gray-200 hidden lg:inline">{{ userName() }}</span>
              <svg class="w-4 h-4 text-gray-500 dark:text-gray-400 hidden lg:inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </button>

            <!-- Dropdown Menu -->
            @if (isUserMenuOpen()) {
              <div
                class="absolute right-0 mt-2 w-48 bg-white dark:bg-zinc-800 rounded-lg shadow-lg border border-gray-200 dark:border-zinc-600 py-1 z-50"
                [attr.data-testid]="'user-dropdown-menu'"
              >
                <!-- Guest: Show Login Option -->
                @if (isGuest()) {
                  <button
                    class="w-full px-4 py-2 text-left text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-zinc-700 flex items-center gap-2"
                    (click)="onLoginClick()"
                    [attr.data-testid]="'menu-login'"
                  >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                    </svg>
                    {{ 'user.signIn' | translate }}
                  </button>
                }

                <!-- Settings -->
                <button
                  class="w-full px-4 py-2 text-left text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-zinc-700 flex items-center gap-2"
                  (click)="onSettingsClick()"
                  [attr.data-testid]="'menu-settings'"
                >
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.598 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  </svg>
                  {{ 'nav.settings' | translate }}
                </button>

                <!-- Theme Toggle -->
                <button
                  class="w-full px-4 py-2 text-left text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-zinc-700 flex items-center gap-2"
                  (click)="onThemeToggle()"
                  [attr.data-testid]="'menu-theme-toggle'"
                >
                  @if (isDarkTheme()) {
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    {{ 'theme.light' | translate }}
                  } @else {
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                    {{ 'theme.dark' | translate }}
                  }
                </button>

                <!-- Divider -->
                <div class="border-t border-gray-200 dark:border-zinc-600 my-1"></div>

                <!-- Logout -->
                <button
                  class="w-full px-4 py-2 text-left text-sm text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/30 flex items-center gap-2"
                  (click)="onLogoutClick()"
                  [attr.data-testid]="'menu-logout'"
                >
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                  </svg>
                  {{ 'user.signOut' | translate }}
                </button>
              </div>
            }
          </div>
        } @else {
          <button
            class="px-4 py-2 bg-lavender-600 hover:bg-lavender-700 text-white rounded-lg font-semibold transition-colors"
            (click)="onLoginClick()"
            [attr.data-testid]="'login-button'"
          >
            {{ 'user.signIn' | translate }}
          </button>
        }
      </div>

      <!-- Mobile Menu Button -->
      <button
        class="md:hidden p-2 hover:bg-gray-100 dark:hover:bg-zinc-700 rounded-lg"
        (click)="toggleMobileMenu()"
        [attr.data-testid]="'mobile-menu-button'"
      >
        <svg class="w-6 h-6 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
  </div>
</nav>

<!-- Mobile Menu -->
<app-mobile-menu
  [isOpen]="isMobileMenuOpen()"
  [navItems]="navItems()"
  [isLoggedIn]="isLoggedIn()"
  [isGuest]="isGuest()"
  [userName]="userName()"
  [isDarkTheme]="isDarkTheme()"
  (close)="closeMobileMenu()"
  (navigate)="closeMobileMenu()"
  (loginClick)="onLoginClick()"
  (logoutClick)="onLogoutClick()"
  (settingsClick)="onSettingsClick()"
  (themeToggle)="onThemeToggle()"
  [attr.data-testid]="'nav-mobile-menu'"
></app-mobile-menu>
