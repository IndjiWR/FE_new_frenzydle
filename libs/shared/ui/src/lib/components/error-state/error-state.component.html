<div class="error-state flex flex-col items-center justify-center p-8 text-center" [attr.data-testid]="'error-state'">
  <svg
    class="w-16 h-16 text-red-400 mb-4"
    fill="none"
    stroke="currentColor"
    viewBox="0 0 24 24"
    xmlns="http://www.w3.org/2000/svg"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2"
      d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
    />
  </svg>
  <p class="text-gray-600 dark:text-gray-400 mb-4" [attr.data-testid]="'error-message'">
    {{ message() || ('common.error' | translate) }}
  </p>
  <button
    class="px-4 py-2 bg-lavender-600 hover:bg-lavender-700 text-white rounded-lg font-semibold transition-colors"
    (click)="onRetry()"
    [attr.data-testid]="'retry-button'"
  >
    {{ 'common.retry' | translate }}
  </button>
</div>
