<!-- Card Skeleton -->
@if (type() === 'card') {
  <div
    class="skeleton-card grid gap-6"
    [class.grid-cols-1]="true"
    [class.sm:grid-cols-2]="true"
    [class.lg:grid-cols-3]="true"
    [class.xl:grid-cols-4]="true"
    [attr.data-testid]="'skeleton-loader'"
  >
    @for (_ of items(); track $index) {
      <div class="skeleton-card-item bg-gray-100 rounded-2xl overflow-hidden animate-pulse">
        <div class="aspect-video bg-gray-200"></div>
        <div class="p-4 space-y-3">
          <div class="h-4 bg-gray-200 rounded w-3/4"></div>
          <div class="h-3 bg-gray-200 rounded w-full"></div>
          <div class="h-3 bg-gray-200 rounded w-2/3"></div>
          <div class="h-8 bg-gray-200 rounded mt-4"></div>
        </div>
      </div>
    }
  </div>
}

<!-- Text Skeleton -->
@if (type() === 'text') {
  <div
    class="skeleton-text bg-gray-200 rounded animate-pulse"
    [style.width]="width()"
    [style.height]="height()"
    [attr.data-testid]="'skeleton-text'"
  ></div>
}

<!-- Circle Skeleton -->
@if (type() === 'circle') {
  <div
    class="flex gap-4"
    [attr.data-testid]="'skeleton-circles'"
  >
    @for (_ of items(); track $index) {
      <div
        class="skeleton-circle w-12 h-12 bg-gray-200 rounded-full animate-pulse"
      ></div>
    }
  </div>
}
