<div class="empty-state flex flex-col items-center justify-center p-8 text-center" [attr.data-testid]="'empty-state'">
  <svg
    class="w-16 h-16 text-gray-300 mb-4"
    fill="none"
    stroke="currentColor"
    viewBox="0 0 24 24"
    xmlns="http://www.w3.org/2000/svg"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2"
      d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"
    />
  </svg>
  <h3
    *ngIf="title"
    class="text-lg font-semibold text-gray-700 mb-2"
    [attr.data-testid]="'empty-title'"
  >
    {{ title }}
  </h3>
  <p
    class="text-gray-500 mb-4"
    [attr.data-testid]="'empty-description'"
  >
    {{ description || ('common.noResults' | translate) }}
  </p>
  <button
    *ngIf="actionText"
    class="px-4 py-2 bg-lavender-600 hover:bg-lavender-700 text-white rounded-lg font-semibold transition-colors"
    (click)="onAction()"
    [attr.data-testid]="'empty-action'"
  >
    {{ actionText }}
  </button>
</div>
