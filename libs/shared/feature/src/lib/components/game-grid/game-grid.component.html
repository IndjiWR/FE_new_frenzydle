<section class="game-grid-container px-4 py-8" [attr.data-testid]="'game-grid'">
  <!-- Section Title -->
  <h2
    class="text-2xl font-bold text-gray-800 mb-6 text-center md:text-left"
    [attr.data-testid]="'game-grid-title'"
  >
    {{ 'home.todaysGames' | translate }}
  </h2>

  <!-- Loading State -->
  <app-skeleton-loader
    *ngIf="state === 'loading'"
    type="card"
    [count]="4"
    [attr.data-testid]="'game-grid-loading'"
  ></app-skeleton-loader>

  <!-- Error State -->
  <app-error-state
    *ngIf="state === 'error'"
    [message]="errorMessage"
    (retry)="onRetry()"
    [attr.data-testid]="'game-grid-error'"
  ></app-error-state>

  <!-- Empty State -->
  <app-empty-state
    *ngIf="state === 'empty'"
    [title]="'empty.noGames' | translate"
    [description]="'empty.checkBackLater' | translate"
    [attr.data-testid]="'game-grid-empty'"
  ></app-empty-state>

  <!-- Games Grid -->
  <div
    *ngIf="state === 'loaded' && games.length > 0"
    class="game-grid grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
    [attr.data-testid]="'game-grid-loaded'"
  >
    <app-game-card
      *ngFor="let game of games; trackBy: trackByGameId; let i = index"
      [game]="game"
      [animationDelay]="getAnimationDelay(i)"
      (cardClick)="onGameClick($event)"
    ></app-game-card>
  </div>
</section>
