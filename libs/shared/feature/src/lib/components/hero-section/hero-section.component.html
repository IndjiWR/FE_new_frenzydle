<section
  class="hero-section flex flex-col items-center justify-center min-h-[40vh] px-4 py-12"
  [attr.data-testid]="'hero-section'"
>
  <!-- Logo -->
  <div class="hero-logo mb-4">
    <app-logo
      size="lg"
      [animated]="animated()"
      [customClass]="'text-5xl md:text-6xl'"
      [attr.data-testid]="'hero-logo'"
    ></app-logo>
  </div>

  <!-- Subtitle -->
  <div class="hero-subtitle text-center max-w-2xl">
    <p
      class="text-lg md:text-xl text-gray-600 font-body"
      [class.fade-in-subtitle]="animated() && showSubtitle()"
      [attr.data-testid]="'hero-subtitle'"
    >
      {{ subtitleText() }}
    </p>
  </div>
</section>
